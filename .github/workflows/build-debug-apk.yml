name: Build Debug APK

on:
  push:
    branches:
      - trae/agent-1JfsNj
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: internal-pages/pnpm-lock.yaml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install internal page dependencies
        run: pnpm --dir internal-pages install --frozen-lockfile

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Rename APK with short sha
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/hyperbrowser-debug-${SHORT_SHA}.apk
          ls -lh app/build/outputs/apk/debug/

      - name: Create release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: Debug Build ${{ github.run_number }}
          body: |
            Auto-generated debug APK from `${{ github.ref_name }}` @ ${{ github.sha }}

            - Built from commit: ${{ github.event.head_commit.message }}
            - Build run: ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk

      - name: Upload debug APK as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: hyperbrowser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
