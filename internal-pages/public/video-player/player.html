<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>视频播放</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  #player { width: 100%; height: 100%; }
  #err {
    display: none;
    position: fixed; left: 0; right: 0; top: 40%;
    color: #ff8a8a; text-align: center; font-size: 14px;
    padding: 0 24px; line-height: 1.8; z-index: 10;
    font-family: system-ui, sans-serif;
  }
</style>
</head>
<body>
<div id="player"></div>
<div id="err"></div>
<script src="hls.light.min.js"></script>
<script src="artplayer.js"></script>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var url = params.get('url') || '';
  var title = params.get('title') || '视频播放';
  document.title = title;

  function fail(msg) {
    var el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = msg;
  }

  if (!url) { fail('没有可播放的地址'); return; }

  var isM3u8 = /\.m3u8(\?|#|$)/i.test(url);

  var art = new Artplayer({
    container: '#player',
    url: url,
    title: title,
    volume: 0.8,
    autoplay: true,
    pip: true,
    autoSize: false,
    autoMini: false,
    screenshot: false,
    setting: true,
    loop: false,
    flip: true,
    playbackRate: true,
    aspectRatio: true,
    fullscreen: true,
    fullscreenWeb: true,
    playsInline: true,
    miniProgressBar: true,
    mutex: true,
    backdrop: true,
    // 移动端手势：左右滑动快进/快退，上下滑动音量/亮度
    gesture: true,
    customType: {
      m3u8: function (video, src) {
        if (window.Hls && Hls.isSupported()) {
          var hls = new Hls({
            // 分片请求走浏览器默认链路；需要改 Referer 的由扩展 background 的
            // webRequest 统一处理（见 movy-antileech 模式）
          });
          hls.loadSource(src);
          hls.attachMedia(video);
          hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) fail('播放失败：' + (data.type || '未知错误'));
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = src;
        } else {
          fail('当前环境不支持 HLS 播放');
        }
      },
    },
  });

  // 非 m3u8 且浏览器原生不支持时给出提示（ArtPlayer 会尝试直接播）
  if (!isM3u8) {
    art.on('error', function () {
      fail('播放失败，地址可能已失效或格式不支持');
    });
  }

  art.on('ready', function () {
    // 竖屏小屏时默认铺满宽度
    document.getElementById('err').style.display = 'none';
  });
})();
</script>
</body>
</html>
